name: Verify experiment

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test codecs and verifier portability
        run: python -m unittest test_poc test_verify_results -v
      - name: Check frozen artifacts and optimization-safe verification
        run: |
          python verify_results.py
          python -O -m unittest test_verify_results -v
